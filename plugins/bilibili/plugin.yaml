id: bilibili
name: Bilibili Video
version: 1.0.0
apiVersion: kite/plugin/v1
description: Turn standalone Bilibili video links into responsive embedded players, including in the studio preview.
hosts: [api.bilibili.com]
hooks: [transform_html]
license: MIT
homepage: https://www.bite.plus/

inject:
  - at: head
    html: <link rel="stylesheet" href="{{ asset "bili.css" }}">
  - at: body
    pages: [single]
    html: <script src="{{ asset "bili.js" }}"></script>
