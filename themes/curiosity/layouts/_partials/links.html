<div class="link-stack">{{ range .items }}{{ if .url }}<a href="{{ url.Rel .url }}"><span><strong>{{ default .text (default .label .name) }}</strong>{{ with .description }}<small>{{ . }}</small>{{ end }}</span><span>↗</span></a>{{ else }}<div class="link-note"><strong>{{ default .text (default .label .name) }}</strong>{{ with .description }}<small>{{ . }}</small>{{ end }}</div>{{ end }}{{ else }}<p class="quiet">{{ T "empty_links" }}</p>{{ end }}</div>
