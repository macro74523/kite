<div class="project-list">{{ range .items }}<section class="project-entry">{{ with .image }}<img class="project-image" src="{{ url.Rel . }}" alt="" loading="lazy">{{ else }}<div class="project-art" aria-hidden="true"><div class="mock-window"><span class="mock-dots">● ● ●</span><div class="mock-lines"><b>{{ .name }}<span>↗</span></b><div class="mock-tiles"><i></i><i></i><i></i></div></div></div><span class="art-label">IDEAS INTO THINGS.</span></div>{{ end }}<h3>{{ if .url }}<a href="{{ url.Rel .url }}">{{ .name }} ↗</a>{{ else }}{{ .name }}{{ end }}</h3>{{ with .description }}<p class="quiet">{{ . }}</p>{{ end }}</section>{{ end }}</div>
