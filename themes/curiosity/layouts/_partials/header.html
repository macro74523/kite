<header class="site-header shell{{ if eq .Page.Kind "single" }} is-article-header{{ end }}">
<a class="brand" href="{{ url.For "home" }}" aria-label="{{ .Site.Title }}">{{ $logo := default .Site.ThemeSettings.logo_dark .Site.ThemeSettings.logo }}{{ with $logo }}<span class="brand-images" style="--logo-desktop:{{ default 36 $.Site.ThemeSettings.logo_size }}px;--logo-mobile:{{ default 45 $.Site.ThemeSettings.logo_size_mobile }}px"><img class="brand-logo brand-logo-light" src="{{ url.Rel . }}" alt="{{ default $.Site.Title $.Site.Author }}"><img class="brand-logo brand-logo-dark" src="{{ url.Rel (default . $.Site.ThemeSettings.logo_dark) }}" alt="{{ default $.Site.Title $.Site.Author }}"></span>{{ else }}{{ default .Site.Title .Site.Author }}<span class="brand-dot"></span>{{ end }}</a>
<nav class="desktop-nav" aria-label="{{ T "menu" }}">{{ if eq .Page.Kind "single" }}<a class="header-back" href="{{ url.For "list" "post" }}" aria-label="{{ T "back" }}" title="{{ T "back" }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a>{{ end }}{{ partial "navigation.html" . }}</nav>
<div class="header-actions"><button class="theme-toggle" id="theme-toggle" aria-label="切换深浅色模式" title="切换深浅色模式"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg></button><button class="contact" id="contact-button"><span class="contact-dot"></span>聊聊 <span class="contact-arrow" aria-hidden="true">↗</span></button></div>
</header>
