<header class="site-header shell{{ if eq .Page.Kind "single" }} is-article-header{{ end }}">
<a class="brand" href="{{ url.For "home" }}" aria-label="{{ .Site.Title }}">{{ $logo := default .Site.ThemeSettings.logo_dark .Site.ThemeSettings.logo }}{{ with $logo }}<span class="brand-images" style="--logo-desktop:{{ default 36 $.Site.ThemeSettings.logo_size }}px;--logo-mobile:{{ default 45 $.Site.ThemeSettings.logo_size_mobile }}px"><img class="brand-logo brand-logo-light" src="{{ url.Rel . }}" width="240" height="240" alt="{{ default $.Site.Title $.Site.Author }}" decoding="async" fetchpriority="high"><img class="brand-logo brand-logo-dark" src="{{ url.Rel (default . $.Site.ThemeSettings.logo_dark) }}" width="240" height="240" alt="{{ default $.Site.Title $.Site.Author }}" decoding="async"></span>{{ else }}{{ default .Site.Title .Site.Author }}<span class="brand-dot"></span>{{ end }}</a>
<nav class="desktop-nav" aria-label="{{ T "menu" }}">{{ if eq .Page.Kind "single" }}<a class="header-back" href="{{ url.For "list" "post" }}" aria-label="{{ T "back" }}" title="{{ T "back" }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a>{{ end }}{{ partial "navigation.html" . }}</nav>
<div class="header-actions"><button class="theme-toggle" id="theme-toggle" data-skin="purple" aria-label="切换深浅色模式" title="切换深浅色模式"><span class="tt-rail" aria-hidden="true"><span class="tt-lever"></span></span></button></div>
</header>
