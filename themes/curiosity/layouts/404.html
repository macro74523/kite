{{ define "main" }}
<section class="card error-page" aria-labelledby="lost-frame-title">
  <div class="error-meta"><span class="error-status"><i aria-hidden="true"></i>FRAME NOT FOUND</span><span>REC / 00:04:04</span></div>
  <div class="error-viewfinder">
    <svg class="error-corners" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M1 15V1H12 M88 1H99V15 M99 85V99H88 M12 99H1V85" /></svg>
    <div class="error-code" aria-hidden="true"><span>4</span><span>0</span><span>4</span></div>
    <div class="error-copy">
      <span class="eyebrow">{{ T "lost_frame_label" }}</span>
      <h1 id="lost-frame-title">{{ T "lost_frame_title" }}</h1>
      <p>{{ T "lost_frame_hint" }}</p>
      <nav class="error-actions" aria-label="{{ T "lost_frame_navigation" }}">
        <a class="pill error-home" href="{{ url.For "home" }}">{{ T "back_home" }} <span aria-hidden="true">↗</span></a>
        <a class="pill" href="{{ url.For "term" "categories" "视频作品" }}">{{ T "works_guide" }} <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </div>
  <div class="error-meta error-bottom"><span>404 / {{ T "lost_frame_label" }}</span><span aria-hidden="true">AF · SEEK A NEW FRAME ↗</span></div>
</section>
{{ end }}
