name: curiosity
title: Curiosity
version: 1.0.0
apiVersion: kite/v1
requires: ">=0.1.0 <2.0.0"
description: A warm bento theme for writing, projects and everyday curiosity.
author:
  name: macro
license: MIT
tags: [blog, bento, portfolio]
capabilities: [static, dynamic]
contentTypes: [post, page]
taxonomies: [tags, categories]
pagination:
  home: 0
  list: 12
  term: 12
menus:
  - name: main
    label: 主导航
    depth: 2
layouts:
  - {name: links, label: 友情链接, types: [page]}
  - {name: projects, label: 项目展示, types: [page]}
settings:
  - key: branding
    type: section
    label: 品牌标识
    preview: home
    fields:
      - {key: logo, type: image, label: 亮色 Logo, help: 上传或拖入图片；未设置时显示站点名称}
      - {key: logo_dark, type: image, label: 暗色 Logo, help: 暗色模式自动使用此图片，留空沿用亮色 Logo}
      - {key: logo_size, type: number, label: 桌面 Logo 高度, default: 36, min: 20, max: 120, step: 1, help: 单位 px，建议 36–60}
      - {key: logo_size_mobile, type: number, label: 手机 Logo 高度, default: 45, min: 20, max: 72, step: 1, help: 单位 px，建议 32–48}
      - {key: favicon, type: image, label: 网站图标, help: 上传方形图片，建议至少 64 × 64 px}
  - key: profile
    type: section
    label: 个人资料
    preview: home
    fields:
      - {key: intro, type: text, label: 首页介绍, help: 显示在首页头像卡片的自我介绍}
      - {key: avatar, type: image, label: 头像, help: 用于首页头像和“聊聊”弹窗，留空显示首字母}
      - {key: contact, type: url, label: 个人网站, help: 显示在“聊聊”弹窗}
      - {key: email, type: string, label: 邮箱, help: 显示在“聊聊”弹窗}
      - {key: qq, type: string, label: QQ号, help: 显示在“聊聊”弹窗，留空则不显示}
  - key: homepage
    type: section
    label: 首页内容
    preview: home
    fields:
      - {key: photo, type: image, label: 回退照片, help: 首页“日常切片”卡片优先随机展示“瞬间”分类文章，仅当没有任何瞬间时才显示此照片；留空使用生成的海边照片}
      - {key: photo_caption, type: string, label: 照片说明, help: 回退照片下方显示的文字}
      - key: plan_goals
        type: repeat
        label: 计划预期
        help: 首页"计划预期"卡片显示的目标清单
        fields:
          - {key: title, type: string, label: 目标名称, default: '大语言模型原理'}
          - {key: progress, type: number, label: 进度(%), default: 65, min: 0, max: 100}
          - {key: tag, type: string, label: 标签, default: '学习', help: '分类标签，如：学习 / 阅读 / 项目'}
          - {key: status, type: string, label: 状态, default: '进行中', help: '如：未开始 / 进行中 / 已完成'}
      - {key: plan_footer_text, type: string, label: 底部寄语, default: '日拱一卒，功不唐捐', help: '组件底部显示的鼓励文字'}
      - {key: timezone, type: string, label: IANA 时区, default: Asia/Shanghai, help: 用于签到、统计与日历的时区，例如 Asia/Shanghai 或 Europe/London}
  - key: collections
    type: section
    label: 收藏夹
    preview: home
    fields:
      - key: bookmarks
        type: repeat
        label: 收藏链接
        help: 首页“收藏夹”卡片展示的快捷链接
        fields:
          - {key: name, type: string, label: 名称}
          - {key: description, type: string, label: 说明}
          - {key: url, type: url, label: 链接}
  - key: pages
    type: section
    label: 独立页面
    preview: page
    fields:
      - key: projects
        type: repeat
        label: 项目列表
        help: 使用「项目展示」页面模板时展示的项目，页面自身的项目字段优先
        fields:
          - {key: name, type: string, label: 项目名称}
          - {key: description, type: text, label: 简介}
          - {key: url, type: url, label: 链接}
          - {key: image, type: image, label: 图片}
      - key: links
        type: repeat
        label: 友情链接
        help: 使用「友情链接」页面模板时展示的站点，页面自身的链接字段优先
        fields:
          - {key: name, type: string, label: 名称}
          - {key: description, type: string, label: 说明}
          - {key: url, type: url, label: 链接}
  - key: listening
    type: section
    label: 音乐
    preview: home
    fields:
      - {key: audio_file, type: image, label: 上传音乐, help: 上传本地音乐文件（支持 mp3 等格式），优先于下方的音频 URL}
      - {key: audio_url, type: url, label: 音频 URL, help: 音乐文件外链地址，未上传音乐时使用此字段}
      - {key: audio_title, type: string, label: 音频标题}
      - {key: audio_author, type: string, label: 音频作者}
      - key: social
        type: repeat
        label: 社交链接
        fields:
          - {key: name, type: string, label: 名称}
          - {key: url, type: url, label: 链接}
  - key: appearance
    type: section
    label: 外观
    preview: home
    fields:
      - {key: accent, type: color, label: 强调色, default: '#6366f1'}
      - {key: bg_color, type: color, label: 背景色, default: '#f8fafc', help: 页面整体背景颜色（渐变为空时使用）}
      - {key: gradient_start, type: color, label: 渐变起始色, default: '#eff6ff', help: 渐变的起始颜色（顶部）}
      - {key: gradient_mid, type: color, label: 渐变中间色, default: '#f8fafc', help: 渐变的中间过渡颜色}
      - {key: gradient_end, type: color, label: 渐变结束色, default: '#f1f5f9', help: 渐变的结束颜色（底部）}
      - {key: gradient_angle, type: string, label: 渐变角度, default: '180deg', help: 渐变方向角度，例如 135deg（对角）、180deg（从上到下）、90deg（从左到右）}
      - {key: card_color, type: color, label: 卡片色, default: '#ffffff', help: 卡片和模块的背景颜色}
      - {key: line_color, type: color, label: 边框色, default: '#e2e8f0', help: 边框和分隔线的颜色}
      - {key: card_radius, type: number, label: 卡片圆角, default: 7, min: 0, max: 24, step: 1, help: 单位 px，所有卡片和模块的圆角半径}
      - {key: card_padding, type: number, label: 卡片内边距, default: 22, min: 12, max: 40, step: 1, help: 单位 px，卡片内容与边框的距离}
      - {key: gap_size, type: number, label: 卡片间距, default: 12, min: 4, max: 28, step: 1, help: 单位 px，各卡片之间的间距}
      - {key: card_opacity, type: number, label: 卡片背景透明度, default: 100, min: 60, max: 100, step: 5, help: 百分比，数值越小卡片越透（需搭配透明卡片色才有效果）}
      - {key: card_shadow, type: boolean, label: 显示卡片阴影, default: true}
      - {key: show_toc, type: boolean, label: 显示目录, default: true}
  - key: layout
    type: section
    label: 首页布局
    preview: home
    fields:
      - {key: default_view, type: select, label: 默认视图, default: tiles, options: [{value: bento, label: 经典网格（固定位置）}, {value: tiles, label: 自由拼接（可拖拽）}]}
      - {key: tile_cols, type: number, label: 拼接列数, default: 3, min: 2, max: 5, step: 1, help: 建议 3 或 4}
      - {key: tile_row_height, type: number, label: 拼接行高, default: 280, min: 180, max: 420, step: 20, help: 单位 px}
      - key: card_layout_json
        type: string
        label: 卡片默认位置（JSON）
        help: |
          自由拼接模式下每张卡片的起始行/列、宽/高。
          留空使用默认布局；填写后会覆盖默认位置。
          支持的卡片 key：works、hero、plan、moments、stats、archive、cal、bookmarks、music
          行列从 1 开始。示例：
          {
            "works": {"r":1,"c":1,"w":2,"h":2},
            "hero": {"r":1,"c":3,"w":1,"h":2},
            "plan": {"r":3,"c":1,"w":1,"h":1},
            "moments": {"r":3,"c":2,"w":2,"h":1},
            "stats": {"r":4,"c":1,"w":2,"h":1},
            "archive": {"r":4,"c":3,"w":1,"h":1},
            "cal": {"r":5,"c":1,"w":1,"h":1},
            "bookmarks": {"r":5,"c":2,"w":1,"h":1},
            "music": {"r":5,"c":3,"w":1,"h":1}
          }
