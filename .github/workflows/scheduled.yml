# 到达定时发布时间后，通过 Cloudflare Pages Deploy Hook 触发重建。
name: Publish scheduled posts

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: .kite-next-due
          key: kite-next-due
          restore-keys: kite-next-due-
      - name: 检查发布时间并触发 Cloudflare
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        shell: bash
        run: |
          due=$(cat .kite-next-due 2>/dev/null || echo unknown)
          case "$due" in
            none) exit 0 ;;
            unknown) ;;
            *)
              at=$(date -u -d "$due" +%s 2>/dev/null) || at=0
              if [ "$(date -u +%s)" -lt "$at" ]; then exit 0; fi
              ;;
          esac
          if [ -z "$DEPLOY_HOOK" ]; then
            echo '::notice::如需定时发布，请设置 CLOUDFLARE_PAGES_DEPLOY_HOOK 仓库 Secret。普通 Git 推送仍由 Cloudflare 自动部署。'
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK" > /dev/null
